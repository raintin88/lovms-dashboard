services:
  - type: web
    name: lovms-dashboard
    runtime: node
    plan: free
    region: oregon
    buildCommand: "true"
    startCommand: node server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: REMOTE_MODE
        value: "1"
      - key: HOST
        value: 0.0.0.0
      - key: TZ
        value: Asia/Shanghai
      - key: KB_DIR
        value: /tmp/kb
      - key: SHOPIFY_SHOP
        value: qw1wau-ty.myshopify.com
      - key: DASH_PASSWORD
        sync: false
      - key: DASH_SECRET
        generateValue: true
      - key: SYNC_TOKEN
        sync: false
